<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link
			rel="preload"
			href="/fonts/ronzino-regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/sinistre-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			const legacy = localStorage.getItem('theme');
			if (legacy) {
				if (legacy === 'light') localStorage.setItem('flavor', 'latte');
				if (legacy === 'dark') localStorage.setItem('flavor', 'mocha');
				localStorage.removeItem('theme');
			}
			const flavor = localStorage.getItem('flavor');
			if (['latte', 'frappe', 'macchiato', 'mocha'].includes(flavor)) {
				document.documentElement.dataset.flavor = flavor;
			}
			const accent = localStorage.getItem('accent');
			if (accent && accent !== 'blue') {
				document.documentElement.dataset.accent = accent;
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
